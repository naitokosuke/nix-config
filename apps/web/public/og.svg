  <!-- Nix snowflake (right side, partially clipped) -->
  <g transform="translate(1020, 500)" fill="rgba(255,255,255,0.10)" opacity="0.9">
    <g transform="scale(1.4)">
      <g transform="translate(-156.41121, 933.30685)">
        <g transform="matrix(0.99994059,0,0,0.99994059,-0.06321798,33.188377)">
          <path id="og-nix-blade" d="m 309.54892,-710.38827 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8257 z" />
          <use href="#og-nix-blade" transform="rotate(60, 407.11155, -715.78724)" />
          <use href="#og-nix-blade" transform="rotate(120, 407.33916, -716.08356)" />
          <use href="#og-nix-blade" transform="rotate(180, 407.41868, -715.7565)" />
          <use href="#og-nix-blade" transform="rotate(-120, 407.28823, -715.86995)" />
          <use href="#og-nix-blade" transform="rotate(-60, 407.31177, -715.70016)" />
        </g>
      </g>
    </g>
