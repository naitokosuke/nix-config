  <!-- title -->
  <text x="80" y="320" fill="#f7f7f8" font-size="100" font-weight="600" letter-spacing="-3">
    <tspan fill="rgba(255,255,255,0.55)" font-weight="300">naitokosuke</tspan><tspan fill="rgba(255,255,255,0.3)" font-weight="200">/</tspan>dotfiles
  </text>

  <!-- subtitle -->
  <text x="80" y="380" fill="rgba(255,255,255,0.65)" font-size="26" font-weight="400">
