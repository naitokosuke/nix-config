name: nvfetcher

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 JST
    - cron: "0 23 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Run nvfetcher
        run: |
          printf '[keys]\ngithub = "%s"\n' "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/keyfile.toml"
          nix run nixpkgs#nvfetcher -- --keyfile "$RUNNER_TEMP/keyfile.toml" -o pkgs/_sources

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: nvfetcher-update
          commit-message: "chore: update nvfetcher sources"
          title: "chore: update nvfetcher sources"
          body: |
            Automated update of `pkgs/_sources/generated.nix` by the nvfetcher workflow.
          add-paths: pkgs/_sources/
          delete-branch: true
