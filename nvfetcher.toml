# Version tracker for CLI tools not available in nixpkgs (issue #342).
# Regenerate pkgs/_sources/generated.nix after editing:
#   nix run nixpkgs#nvfetcher -- -o pkgs/_sources
[ax-darwin-arm64]
src.github = "yusukebe/ax"
fetch.url = "https://github.com/yusukebe/ax/releases/download/$ver/ax-darwin-arm64"

[gwq-darwin-arm64]
src.github = "d-kuro/gwq"
fetch.url = "https://github.com/d-kuro/gwq/releases/download/$ver/gwq_Darwin_arm64.tar.gz"

# The asset name embeds the version without the "v" tag prefix, so strip it
# here instead of in the derivation.
[gh-sub-issue-darwin-arm64]
src.github = "yahsan2/gh-sub-issue"
src.prefix = "v"
fetch.url = "https://github.com/yahsan2/gh-sub-issue/releases/download/v$ver/gh-sub-issue_$ver_darwin-arm64"

[vize-darwin-arm64]
src.github = "ubugeeei-prod/vize"
fetch.url = "https://github.com/ubugeeei-prod/vize/releases/download/$ver/vize-aarch64-apple-darwin.tar.gz"

# The asset name embeds the version without the "v" tag prefix, so strip it
# here instead of in the derivation.
[octorus-darwin-arm64]
src.github = "ushironoko/octorus"
src.prefix = "v"
fetch.url = "https://github.com/ushironoko/octorus/releases/download/v$ver/octorus-$ver-aarch64-apple-darwin.tar.gz"

[vite-plus-darwin-arm64]
src.github = "voidzero-dev/vite-plus"
fetch.url = "https://github.com/voidzero-dev/vite-plus/releases/download/$ver/vp-aarch64-apple-darwin.tar.gz"

# npm-only distribution (no release binaries), so this is built from source
# with buildNpmPackage. When bumping, pkgs/playwright-cli.nix's npmDepsHash
# must be updated by hand — the build fails loudly until it is.
[playwright-cli]
src.github = "microsoft/playwright-cli"
fetch.github = "microsoft/playwright-cli"

# Release tags carry an npm-style "frog@" prefix, stripped here so $ver is
# the bare version. The release asset is a gzipped single binary.
[frog-darwin-arm64]
src.github = "wevm/frog"
src.prefix = "frog@"
fetch.url = "https://github.com/wevm/frog/releases/download/frog@$ver/frog-darwin-arm64.gz"

# The published npm tarball bundles all dependencies (rollup) and ships the
# built JS, so it is consumed directly — no npm install, no TypeScript build.
# Release tags carry a "chrome-devtools-mcp-v" prefix, stripped here so $ver
# matches the npm version.
[chrome-devtools-mcp]
src.github = "ChromeDevTools/chrome-devtools-mcp"
src.prefix = "chrome-devtools-mcp-v"
fetch.url = "https://registry.npmjs.org/chrome-devtools-mcp/-/chrome-devtools-mcp-$ver.tgz"
