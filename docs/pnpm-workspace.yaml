allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  # Security floors for transitive deps whose parents pin vulnerable versions
  # (miniflare/wrangler pin ws/undici exactly; sharp 0.35 is outside miniflare's ^0.34.5)
  sharp: ^0.35.0
  ws: ^8.21.0
  undici: ^7.29.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  esbuild: ">=0.28.1"
  sharp: "catalog:"
  ws: "catalog:"
  undici: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
